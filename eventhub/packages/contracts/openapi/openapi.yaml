openapi: 3.1.0

info:
  title: EventHub API
  version: 1.0.0
  description: API для каталога событий EventHub

servers:
  - url: http://localhost:3000

paths:
  /events:
    get:
      summary: Получить список событий
      operationId: getEvents
      parameters:
        - name: city
          in: query
          required: false
          description: Фильтрация событий по городу
          schema:
            type: string

        - name: from
          in: query
          required: false
          description: Показывать события не раньше указанной даты
          schema:
            type: string
            format: date

        - name: cursor
          in: query
          required: false
          description: Курсор предыдущей страницы
          schema:
            type: string

        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:

        '200':
          description: Список событий
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventPage'
              examples:
                filled:
                  summary: Каталог с событием
                  value:
                    items:
                      - id: 018f2c1e-4a7b-7c3d-9e1f-2a5b6c7d8e9f
                        title: Симфонічний вечір
                        description: Концерт класичної музики
                        startsAt: '2026-12-19T19:00:00Z'
                        venue:
                          id: 018f2c1e-0000-7c3d-9e1f-2a5b6c7d8e00
                          name: Філармонія
                          city: Вінниця
                        minPrice:
                          amount: 25000
                          currency: UAH
                        availableSeats: 143
                    nextCursor: null

                empty:
                  summary: Пустий каталог подій
                  value:
                    items: []
                    nextCursor: null

        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                properties:
                  message:
                    type: string
                    example: Internal server error


  /events/{eventId}:
    get:
      operationId: getEvent
      summary: Получить информацию об одном событии
      tags:
        - catalog
      parameters:
        - name: eventId
          in: path
          required: true
          description: Уникальный идентификатор события
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Информация о событии
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '404':
          description: Событие не найдено
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                properties:
                  message:
                    type: string
                    example: Event not found

components:
  schemas:

    Event:
      type: object
      required:
        - id
        - title
        - startsAt
        - venue
        - minPrice
        - availableSeats
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        startsAt:
          type: string
          format: date-time
        venue:
          $ref: '#/components/schemas/VenueSummary'
        minPrice:
          $ref: '#/components/schemas/Money'
        availableSeats:
          type: integer
          minimum: 0

    EventPage:
      type: object
      required:
        - items
        - nextCursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Event'
        nextCursor:
          type:
            - string
            - 'null'
          description: Курсор следующей страницы; null — страниц больше нет
  
    VenueSummary:
      type: object
      required:
        - id
        - name
        - city
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        city:
          type: string

    Money:
      type: object
      required:
        - amount
        - currency
      description: Сумма в минимальных единицах валюты (копейках)
      properties:
        amount:
          type: integer
        currency:
          type: string
          enum: [UAH]

