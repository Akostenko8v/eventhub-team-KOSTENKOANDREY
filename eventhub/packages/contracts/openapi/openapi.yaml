openapi: 3.1.0

info:
  title: EventHub API
  version: 1.0.0
  description: API для каталога событий EventHub

servers:
  - url: http://localhost:3000

paths:
  /events:
    get:
      summary: Получить список событий
      operationId: getEvents
      responses:
        '200':
          description: Список событий
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Event'

components:
  schemas:
    Event:
      type: object
      required:
        - id
        - title
        - date
      properties:
        id:
          type: string
          example: event-001
        title:
          type: string
          example: Концерт в Одессе
        date:
          type: string
          format: date-time
          example: '2026-11-15T19:00:00Z'
        location:
          type: string
          example: Одесса
